<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}算法学习系统{% endblock %}</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --bg-deep: #111f3c;
      --surface: #ffffff;
      --surface-soft: #f8fbff;
      --line: #dbe4f3;
      --text: #0f172a;
      --muted: #5f6b82;
      --primary: #2563eb;
      --primary-strong: #1d4ed8;
      --secondary: #334155;
      --easy-bg: #dcfce7;
      --easy-text: #166534;
      --medium-bg: #fef3c7;
      --medium-text: #92400e;
      --hard-bg: #fee2e2;
      --hard-text: #991b1b;
      --shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      font-family: "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      margin: 0;
      color: var(--text);
      background: radial-gradient(1200px 360px at 15% -10%, rgba(59, 130, 246, 0.28), transparent),
                  radial-gradient(900px 300px at 90% -10%, rgba(14, 165, 233, 0.24), transparent),
                  linear-gradient(180deg, #eef4ff 0%, #f8fbff 42%, #f3f7ff 100%);
      min-height: 100vh;
    }

    a { color: var(--primary); }

    .nav {
      display: flex;
      gap: 16px;
      align-items: center;
      padding: 14px 22px;
      background: linear-gradient(135deg, var(--bg-dark), var(--bg-deep));
      color: #e2e8f0;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 6px 24px rgba(15, 23, 42, 0.35);
    }

    .nav .brand {
      font-weight: 700;
      letter-spacing: .4px;
      color: #fff;
      margin-right: 4px;
    }

    .nav a {
      color: #cfe1ff;
      text-decoration: none;
      font-size: 14px;
      padding: 6px 8px;
      border-radius: 8px;
      transition: background-color .2s ease, color .2s ease;
    }

    .nav a:hover {
      color: #fff;
      background: rgba(148, 163, 184, 0.2);
    }

    .nav .sp { flex: 1; }
    .nav .nav-divider { width:1px; height:24px; background:rgba(255,255,255,.15); margin:0 4px; align-self:center; }

    .nav .user-dropdown { position:relative; display:inline-block; flex-shrink:0; }
    .nav .user-btn { background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.2); color:#e2e8f0; border-radius:8px; padding:6px 12px; cursor:pointer; font-size:13px; display:flex;align-items:center;gap:6px;white-space:nowrap; }
    .nav .user-btn:hover { background:rgba(255,255,255,.2); }
    .nav .user-btn .arrow { font-size:10px; transition:transform .2s; }
    .nav .user-btn.open .arrow { transform:rotate(180deg); }
    .nav .dropdown-menu { display:none; position:absolute; right:0; top:100%; margin-top:6px; background:#fff; border:1px solid #e5e7eb; border-radius:10px; box-shadow:0 12px 40px rgba(15,23,42,.15); min-width:150px; z-index:200; overflow:hidden; }
    .nav .dropdown-menu.show { display:block; }
    .nav .dropdown-menu a { display:block; padding:10px 16px; color:#334155; font-size:13px; text-decoration:none; border-radius:0; }
    .nav .dropdown-menu a:hover { background:#f1f5f9; color:#0f172a; }
    .nav .dropdown-menu hr { margin:0; border:none; border-top:1px solid #e5e7eb; }
    .nav .dropdown-menu .menu-label { display:block; padding:6px 16px 2px; font-size:10px; color:#94a3b8; text-transform:uppercase; letter-spacing:.5px; }
    .nav .nav-login-btn { color:#fbbf24; border:1px solid rgba(251,191,36,.4); border-radius:8px; padding:6px 14px; font-weight:600; flex-shrink:0; }
    .nav .nav-login-btn:hover { background:rgba(251,191,36,.15); color:#fbbf24; }

    .container {
      max-width: 1240px;
      margin: 18px auto;
      padding: 0 14px 16px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 16px;
      box-shadow: var(--shadow);
    }

    .btn {
      border: none;
      background: linear-gradient(135deg, var(--primary), var(--primary-strong));
      color: #fff;
      border-radius: 10px;
      padding: 9px 14px;
      font-weight: 600;
      cursor: pointer;
      transition: transform .15s ease, filter .2s ease;
    }

    .btn:hover { transform: translateY(-1px); filter: brightness(1.05); }

    .btn.secondary {
      background: linear-gradient(135deg, #64748b, var(--secondary));
    }

    .muted { color: var(--muted); font-size: 13px; }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
    }

    .easy { background: var(--easy-bg); color: var(--easy-text); }
    .medium { background: var(--medium-bg); color: var(--medium-text); }
    .hard { background: var(--hard-bg); color: var(--hard-text); }

    .row { display: flex; gap: 14px; flex-wrap: wrap; }
    .col { flex: 1; min-width: 260px; }

    input, select, textarea {
      width: 100%;
      border: 1px solid #cdd9ed;
      border-radius: 10px;
      padding: 9px 10px;
      background: #fff;
      color: var(--text);
      outline: none;
      transition: border-color .2s ease, box-shadow .2s ease;
    }

    input:focus, select:focus, textarea:focus {
      border-color: #60a5fa;
      box-shadow: 0 0 0 3px rgba(96, 165, 250, .2);
    }

    ul, ol { margin: 10px 0 0; padding-left: 20px; }
    li { margin-bottom: 6px; }

    @media (max-width: 900px) {
      .nav { flex-wrap: wrap; gap: 10px; }
      .container { margin-top: 14px; padding: 0 8px 12px; }
      .row { flex-direction: column; gap: 10px; }
      .col { min-width: 100%; }
    }
    @media (max-width: 480px) {
      .nav { padding: 10px 12px; gap: 6px; }
      .nav a { font-size: 12px; padding: 4px 6px; }
      .nav .brand { font-size: 14px; }
      .card { padding: 12px; border-radius: 10px; }
      h2 { font-size: 20px; }
      h3 { font-size: 16px; }
      .hero-title { font-size: 20px; }
    }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <div class="nav">
    <span class="brand">算法学习系统</span>
    <a href="/">首页图谱</a>
    <a href="/path">学习路径</a>
    <span class="sp"></span>
    <span class="badge" style="background:rgba(148,163,184,.22);color:#dbeafe">session: {{ session_id or '-' }}</span>
    <span class="nav-divider"></span>
    {% if session.get('username') %}
    <div class="user-dropdown" id="userDropdown">
      <button class="user-btn" onclick="document.getElementById('userMenu').classList.toggle('show');this.classList.toggle('open')">
        {{ session.username }} <span class="arrow">▼</span>
      </button>
      <div class="dropdown-menu" id="userMenu">
        {% if session.get('user_role') == 'admin' %}
        <span class="menu-label">管理功能</span>
        <a href="/admin/users">用户管理</a>
        <hr/>
        {% endif %}
        <a href="/profile">个人学习页</a>
        <a href="/path">学习路径</a>
        <hr/>
        <a href="/logout" style="color:#dc2626">退出登录</a>
      </div>
    </div>
    {% else %}
    <a href="/login" class="nav-login-btn">登录</a>
    {% endif %}
  </div>
  <div class="container">
    {% block content %}{% endblock %}
  </div>
  {% block scripts %}{% endblock %}
</body>
</html>
